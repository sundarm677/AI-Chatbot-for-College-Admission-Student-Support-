[project]
name = "smart-campus-ai-chatbot"
version = "0.1.0"
description = "AI Chatbot for College Admission and Student Support"
requires-python = ">=3.9,<3.13"
dependencies = [
    "flask==2.3.3",
    "werkzeug==2.3.7",
    "flask-compress==1.14",
    "scikit-learn==1.3.0",
    "numpy==1.26.3",
    "nltk==3.8.1",
    "spacy==3.7.2",
    "googletrans==4.0.0rc1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
